services:
  context-bridge:
    build: .
    restart: unless-stopped
    ports:
      # Safe local default. Put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_KEYS: ${API_KEYS:-}
      API_KEY_NAMESPACES: ${API_KEY_NAMESPACES:-}
      API_KEY_POLICIES: ${API_KEY_POLICIES:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      RATE_LIMIT_BACKEND: redis
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://bridge:${POSTGRES_PASSWORD:-bridge}@postgres:5432/context_bridge
      WORKING_PROVIDER: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - qdrant
      - postgres
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge}
      POSTGRES_DB: context_bridge
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  qdrant_storage:
  pg_data:
